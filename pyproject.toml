[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "dramaser"
version = "0.1.0"
description = "The Agent-native layer that locks characters across episodes for vertical drama teams."
license = "MIT"
requires-python = ">=3.12"
authors = [
    { name = "SuperMarioYL" },
]
keywords = [
    "vertical-drama",
    "ai-video",
    "character-consistency",
    "jianying",
    "capcut",
    "video-generation",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Video",
]
dependencies = [
    "pyJianYingDraft>=0.3,<0.4",
    "typer>=0.12",
    "pydantic>=2.7",
    "httpx>=0.27",
    "pillow>=10.3",
    "rich>=13.7",
]

[project.scripts]
dramaser = "dramaser.cli:app"

[project.urls]
Homepage = "https://github.com/SuperMarioYL/dramaser"
Repository = "https://github.com/SuperMarioYL/dramaser"
Issues = "https://github.com/SuperMarioYL/dramaser/issues"

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/dramaser"]

[tool.pytest.ini_options]
testpaths = ["tests"]
