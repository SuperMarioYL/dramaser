name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pytest
      - name: Lint (byte-compile all sources)
        run: python -m compileall -q src/dramaser
      - name: Test
        run: python -m pytest -q
      - name: No-key demo smoke
        run: |
          dramaser demo
          dramaser check draft dramaser-demo/jianying/dramaser_demo
