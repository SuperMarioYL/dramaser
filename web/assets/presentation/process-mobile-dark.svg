<svg xmlns="http://www.w3.org/2000/svg" width="400" height="840" viewBox="0 0 400 840" data-palette="e656d5-e76a96-e3acf6-6172dcf00cd7" role="img" aria-labelledby="process-mobile-dark-title process-mobile-dark-desc"><title id="process-mobile-dark-title">dramaser process</title><desc id="process-mobile-dark-desc">Drifted shots fail the gate and get regenerated; locked shots keep their assets.</desc><defs><linearGradient id="brand" gradientUnits="userSpaceOnUse" x2="400" y2="840"><stop stop-color="#e656d5"/><stop offset=".6" stop-color="#e76a96"/><stop offset="1" stop-color="#e3acf6"/></linearGradient><radialGradient id="halo"><stop stop-color="#e656d5" stop-opacity=".22"/><stop offset="1" stop-color="#0a0711" stop-opacity="0"/></radialGradient><filter id="glow"><feGaussianBlur stdDeviation="5"/></filter><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#3a183c" stroke-opacity=".35" stroke-width=".6"/></pattern><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="m1 1 7 4-7 4" fill="none" stroke="#e656d5" stroke-width="1.5"/></marker></defs><style>text{font-family:Arial,"Noto Sans",sans-serif}.flow{stroke-dasharray:10 110;animation:flow 6s linear infinite}.pulse{animation:pulse 5s ease-in-outinfinite}.turn{transform-box:fill-box;transform-origin:center;animation:turn 36s linear infinite}@keyframes flow{to{stroke-dashoffset:-360}}@keyframes pulse{0%,100%{opacity:.45}50%{opacity:1}}@keyframes turn{to{transform:rotate(360deg)}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transform:none!important}.flow{display:none}}</style><rect width="400" height="840" rx="16" fill="#0a0711"/><rect width="400" height="840" rx="16" fill="url(#grid)"/><ellipse cx="252.0" cy="361.2" rx="200.0" ry="588.0" fill="url(#halo)"/><text x="28" y="44" fill="#b29cc1" font-size="13" text-anchor="start" font-weight="400">PROCESS / FROM LOCK TO DRAFT</text><text x="28" y="84.0" fill="#f9eefd" font-size="25" text-anchor="start" font-weight="400">dramaser / locked</text><text x="28" y="119.0" fill="#f9eefd" font-size="25" text-anchor="start" font-weight="400">production loop</text><path d="M200 257V290" fill="none" stroke="#e656d5" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M200 257V290" class="flow" fill="none" stroke="#e3acf6" stroke-width="2"/><rect x="28" y="135" width="344" height="122" rx="12" fill="#13101e" stroke="#3a183c"/><text x="46" y="166.0" fill="#f9eefd" font-size="21" text-anchor="start" font-weight="400">01  Lock the character</text><text x="46" y="218.0" fill="#b29cc1" font-size="17" text-anchor="start" font-weight="400">appearance lock in every prompt</text><path d="M200 412V445" fill="none" stroke="#e656d5" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M200 412V445" class="flow" fill="none" stroke="#e3acf6" stroke-width="2"/><rect x="28" y="290" width="344" height="122" rx="12" fill="#13101e" stroke="#3a183c"/><text x="46" y="321.0" fill="#f9eefd" font-size="21" text-anchor="start" font-weight="400">02  Generate and judge</text><text x="46" y="373.0" fill="#b29cc1" font-size="17" text-anchor="start" font-weight="400">Vidu reference / GLM-4V per</text><text x="46" y="396.8" fill="#b29cc1" font-size="17" text-anchor="start" font-weight="400">shot</text><path d="M200 567V600" fill="none" stroke="#e656d5" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M200 567V600" class="flow" fill="none" stroke="#e3acf6" stroke-width="2"/><rect x="28" y="445" width="344" height="122" rx="12" fill="#13101e" stroke="#3a183c"/><text x="46" y="476.0" fill="#f9eefd" font-size="21" text-anchor="start" font-weight="400">03  Record lineage</text><text x="46" y="528.0" fill="#b29cc1" font-size="17" text-anchor="start" font-weight="400">params hash / score / status</text><rect x="28" y="600" width="344" height="122" rx="12" fill="#13101e" stroke="#3a183c"/><text x="46" y="631.0" fill="#f9eefd" font-size="21" text-anchor="start" font-weight="400">04  Regen drifted only</text><text x="46" y="683.0" fill="#b29cc1" font-size="17" text-anchor="start" font-weight="400">export a fresh JianYing draft</text><text x="28" y="775.0" fill="#e3acf6" font-size="18" text-anchor="start" font-weight="400">Drifted shots fail the gate and</text><text x="28" y="800.2" fill="#e3acf6" font-size="18" text-anchor="start" font-weight="400">get regenerated; locked shots…</text></svg>
