<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="465" viewBox="0 0 1000 465" data-palette="e656d5-e76a96-e3acf6-6172dcf00cd7" role="img" aria-labelledby="process-light-title process-light-desc"><title id="process-light-title">dramaser process</title><desc id="process-light-desc">Drifted shots fail the gate and get regenerated; locked shots keep their assets.</desc><defs><linearGradient id="brand" gradientUnits="userSpaceOnUse" x2="1000" y2="465"><stop stop-color="#b443a7"/><stop offset=".6" stop-color="#b15173"/><stop offset="1" stop-color="#866591"/></linearGradient><radialGradient id="halo"><stop stop-color="#b443a7" stop-opacity=".22"/><stop offset="1" stop-color="#fef9fe" stop-opacity="0"/></radialGradient><filter id="glow"><feGaussianBlur stdDeviation="5"/></filter><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#f7cbf3" stroke-opacity=".35" stroke-width=".6"/></pattern><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="m1 1 7 4-7 4" fill="none" stroke="#b443a7" stroke-width="1.5"/></marker></defs><style>text{font-family:Arial,"Noto Sans",sans-serif}.flow{stroke-dasharray:10 110;animation:flow 6s linear infinite}.pulse{animation:pulse 5s ease-in-outinfinite}.turn{transform-box:fill-box;transform-origin:center;animation:turn 36s linear infinite}@keyframes flow{to{stroke-dashoffset:-360}}@keyframes pulse{0%,100%{opacity:.45}50%{opacity:1}}@keyframes turn{to{transform:rotate(360deg)}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transform:none!important}.flow{display:none}}</style><rect width="1000" height="465" rx="16" fill="#fef9fe"/><rect width="1000" height="465" rx="16" fill="url(#grid)"/><ellipse cx="630.0" cy="199.95" rx="500.0" ry="325.5" fill="url(#halo)"/><text x="44" y="44" fill="#725e84" font-size="13" text-anchor="start" font-weight="400">PROCESS / FROM LOCK TO DRAFT</text><text x="44" y="84.0" fill="#27162d" font-size="30" text-anchor="start" font-weight="400">dramaser / locked production loop</text><path d="M254.0 237H278.0" fill="none" stroke="#b443a7" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M254.0 237H278.0" class="flow" fill="none" stroke="#866591" stroke-width="2"/><rect x="44.0" y="176" width="210.0" height="122" rx="12" fill="#fef7fd" stroke="#f7cbf3"/><text x="62.0" y="207.0" fill="#27162d" font-size="21" text-anchor="start" font-weight="400">01  Lock the</text><text x="62.0" y="236.4" fill="#27162d" font-size="21" text-anchor="start" font-weight="400">character</text><text x="62.0" y="259.0" fill="#725e84" font-size="17" text-anchor="start" font-weight="400">appearance lock</text><text x="62.0" y="282.8" fill="#725e84" font-size="17" text-anchor="start" font-weight="400">in every prompt</text><path d="M488.0 237H512.0" fill="none" stroke="#b443a7" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M488.0 237H512.0" class="flow" fill="none" stroke="#866591" stroke-width="2"/><rect x="278.0" y="176" width="210.0" height="122" rx="12" fill="#fef7fd" stroke="#f7cbf3"/><text x="296.0" y="207.0" fill="#27162d" font-size="21" text-anchor="start" font-weight="400">02  Generate</text><text x="296.0" y="236.4" fill="#27162d" font-size="21" text-anchor="start" font-weight="400">and judge</text><text x="296.0" y="259.0" fill="#725e84" font-size="17" text-anchor="start" font-weight="400">Vidu reference /</text><text x="296.0" y="282.8" fill="#725e84" font-size="17" text-anchor="start" font-weight="400">GLM-4V per shot</text><path d="M722.0 237H746.0" fill="none" stroke="#b443a7" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M722.0 237H746.0" class="flow" fill="none" stroke="#866591" stroke-width="2"/><rect x="512.0" y="176" width="210.0" height="122" rx="12" fill="#fef7fd" stroke="#f7cbf3"/><text x="530.0" y="207.0" fill="#27162d" font-size="21" text-anchor="start" font-weight="400">03  Record</text><text x="530.0" y="236.4" fill="#27162d" font-size="21" text-anchor="start" font-weight="400">lineage</text><text x="530.0" y="259.0" fill="#725e84" font-size="17" text-anchor="start" font-weight="400">params hash /</text><text x="530.0" y="282.8" fill="#725e84" font-size="17" text-anchor="start" font-weight="400">score / status</text><rect x="746.0" y="176" width="210.0" height="122" rx="12" fill="#fef7fd" stroke="#f7cbf3"/><text x="764.0" y="207.0" fill="#27162d" font-size="21" text-anchor="start" font-weight="400">04  Regen</text><text x="764.0" y="236.4" fill="#27162d" font-size="21" text-anchor="start" font-weight="400">drifted only</text><text x="764.0" y="259.0" fill="#725e84" font-size="17" text-anchor="start" font-weight="400">export a fresh</text><text x="764.0" y="282.8" fill="#725e84" font-size="17" text-anchor="start" font-weight="400">JianYing draft</text><text x="44" y="379.0" fill="#866591" font-size="20" text-anchor="start" font-weight="400">Drifted shots fail the gate and get regenerated; locked shots keep their</text><text x="44" y="407.0" fill="#866591" font-size="20" text-anchor="start" font-weight="400">assets.</text></svg>
