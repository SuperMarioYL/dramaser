name: release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build wheel + sdist into dist/
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Checksums
        run: |
          cd dist
          sha256sum * > checksums.txt
          cat checksums.txt
      - name: Smoke the built wheel (no-key demo ships inside)
        run: |
          python -m pip install dist/*.whl
          dramaser demo
          dramaser check draft dramaser-demo/jianying/dramaser_demo
      - name: Upload dist/ artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  # Opt-in only: set the repo variable PYPI_PUBLISH=true and register the
  # Trusted Publisher (pypi.org -> manage the project) before enabling.
  pypi:
    if: startsWith(github.ref, 'refs/tags/v') && vars.PYPI_PUBLISH == 'true'
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
